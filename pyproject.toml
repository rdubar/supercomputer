[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supercomputer"
version = "1.1.0"
description = "A retro mainframe operator console for your terminal: blinkenlights driven by real system load."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Roger Dubar" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
wallpaper = ["Pillow>=9.1"]

[project.urls]
Homepage = "https://github.com/rdubar/supercomputer"

[project.scripts]
supercomputer = "supercomputer:main"
supercomputer-wallpaper = "supercomputer_wallpaper:main"

[tool.setuptools]
py-modules = ["supercomputer", "supercomputer_wallpaper"]

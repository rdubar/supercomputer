[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supercomputer-console"
dynamic = ["version"]
description = "A retro mainframe operator console for your terminal: blinkenlights driven by real system load."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roger Dubar" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["terminal", "curses", "retro", "blinkenlights", "system-monitor", "raspberry-pi", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
wallpaper = ["Pillow>=9.1"]

[project.urls]
Homepage = "https://github.com/rdubar/supercomputer"
Changelog = "https://github.com/rdubar/supercomputer/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/rdubar/supercomputer/blob/main/ROADMAP.md"
Issues = "https://github.com/rdubar/supercomputer/issues"

[project.scripts]
supercomputer = "supercomputer:main"
supercomputer-wallpaper = "supercomputer_wallpaper:main"

[tool.setuptools]
py-modules = ["supercomputer", "supercomputer_wallpaper"]

[tool.setuptools.dynamic]
version = { attr = "supercomputer.__version__" }
